<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Rashmi Trading Agency</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1, h2 {
      color: #17365d;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000012;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      background: #17365d;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .delete {
      background: #c62828;
    }

    .secondary {
      background: #555;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .product img {
      display: block;
      max-width: 180px;
      max-height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .product button {
      width: auto;
      min-width: 100px;
      margin-right: 6px;
    }

    .message {
      overflow-wrap: anywhere;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    #status {
      color: #333;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Rashmi Trading Agency</h1>
    <p>Product Management Admin Panel</p>

    <div id="loginBox" class="box">
      <h2>Admin Login</h2>

      <form id="loginForm">
        <input
          type="password"
          id="password"
          placeholder="Enter admin password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">Login</button>
      </form>

      <p id="loginMessage" class="message"></p>
    </div>

    <div id="adminArea" class="hidden">
      <div class="box">
        <h2 id="formTitle">Add New Product</h2>

        <form id="productForm">
          <input type="hidden" id="productId">

          <label for="name">Product Name *</label>
          <input id="name" required placeholder="Enter product name">

          <label for="category">Category *</label>
          <input
            id="category"
            required
            placeholder="Example: Paper Plates"
          >

          <label for="description">Description</label>
          <textarea
            id="description"
            placeholder="Product details"
          ></textarea>

          <label for="price">Price</label>
          <input id="price" placeholder="Example: ₹100 per packet">

          <label for="image">Product Image URL</label>
          <input
            id="image"
            type="url"
            placeholder="Paste your image URL here"
          >

          <button type="submit" id="saveButton">Add Product</button>
          <button
            type="button"
            id="cancelButton"
            class="secondary hidden"
          >
            Cancel Edit
          </button>
        </form>

        <p id="formMessage" class="message"></p>
      </div>

      <div class="box">
        <h2>Products</h2>
        <button type="button" id="refreshButton" class="secondary">
          Refresh Products
        </button>

        <p id="status">Loading products...</p>
        <div id="productList"></div>
      </div>

      <button type="button" id="logoutButton" class="delete">
        Logout
      </button>
    </div>
  </div>

  <script>
    const loginBox = document.getElementById("loginBox");
    const adminArea = document.getElementById("adminArea");
    const loginForm = document.getElementById("loginForm");
    const productForm = document.getElementById("productForm");
    const loginMessage = document.getElementById("loginMessage");
    const formMessage = document.getElementById("formMessage");
    const productList = document.getElementById("productList");
    const statusMessage = document.getElementById("status");
    const saveButton = document.getElementById("saveButton");
    const loginButton = document.getElementById("loginButton");

    let products = [];

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));

      if (response.status === 401 || response.status === 403) {
        showLogin("Your session may have expired. Please log in again.");
        throw new Error("Please log in again.");
      }

      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }

      return data;
    }

    function showLogin(message = "") {
      loginBox.classList.remove("hidden");
      adminArea.classList.add("hidden");
      loginMessage.textContent = message;
      productList.replaceChildren();
    }

    async function showAdmin() {
      loginBox.classList.add("hidden");
      adminArea.classList.remove("hidden");
      await loadProducts();
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      loginButton.disabled = true;
      loginMessage.textContent = "Checking password...";

      try {
        const password = document.getElementById("password").value;

        const response = await fetch("/api/admin-session", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ password })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Login failed.");
        }

        document.getElementById("password").value = "";
        loginMessage.textContent = "";
        await showAdmin();
      } catch (error) {
        loginMessage.textContent = error.message;
      } finally {
        loginButton.disabled = false;
      }
    });

    async function loadProducts() {
      statusMessage.textContent = "Loading products...";
      productList.replaceChildren();

      try {
        const data = await apiRequest("/api/products");

        products = Array.isArray(data)
          ? data
          : Array.isArray(data.products)
            ? data.products
            : [];

        statusMessage.textContent =
          products.length + " product(s) found.";

        if (products.length === 0) {
          statusMessage.textContent = "No products found yet.";
          return;
        }

        products.forEach(product => {
          const card = document.createElement("div");
          card.className = "product";

          if (product.image) {
            const img = document.createElement("img");
            img.src = product.image;
            img.alt = product.name || "Product";
            img.loading = "lazy";

            img.addEventListener("error", () => {
              img.alt = "Image could not be loaded";
            });

            card.appendChild(img);
          }

          const title = document.createElement("h3");
          title.textContent = product.name || "";
          card.appendChild(title);

          const category = document.createElement("p");
          category.textContent = "Category: " + (product.category || "");
          card.appendChild(category);

          const description = document.createElement("p");
          description.textContent = product.description || "";
          card.appendChild(description);

          const price = document.createElement("p");
          price.textContent = "Price: " + (product.price || "Contact us");
          card.appendChild(price);

          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "Edit";
          editButton.addEventListener("click", () => editProduct(product));
          card.appendChild(editButton);

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.textContent = "Delete";
          deleteButton.className = "delete";
          deleteButton.addEventListener("click", () => deleteProduct(product));
          card.appendChild(deleteButton);

          productList.appendChild(card);
        });
      } catch (error) {
        statusMessage.textContent = error.message;
      }
    }

    function editProduct(product) {
      document.getElementById("productId").value = product.id;
      document.getElementById("name").value = product.name || "";
      document.getElementById("category").value = product.category || "";
      document.getElementById("description").value = product.description || "";
      document.getElementById("price").value = product.price || "";
      document.getElementById("image").value = product.image || "";

      document.getElementById("formTitle").textContent = "Edit Product";
      saveButton.textContent = "Save Changes";
      document.getElementById("cancelButton").classList.remove("hidden");

      formMessage.textContent = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      productForm.reset();
      document.getElementById("productId").value = "";
      document.getElementById("formTitle").textContent = "Add New Product";
      saveButton.textContent = "Add Product";
      document.getElementById("cancelButton").classList.add("hidden");
      formMessage.textContent = "";
    }

    document.getElementById("cancelButton").addEventListener("click", resetForm);

    productForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      saveButton.disabled = true;
      formMessage.textContent = "Saving product...";

      const id = document.getElementById("productId").value;

      const product = {
        name: document.getElementById("name").value.trim(),
        category: document.getElementById("category").value.trim(),
        description: document.getElementById("description").value.trim(),
        price: document.getElementById("price").value.trim(),
        image: document.getElementById("image").value.trim()
      };

      try {
        const data = await apiRequest(
          id
            ? "/api/products?id=" + encodeURIComponent(id)
            : "/api/products",
          {
            method: id ? "PUT" : "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(id ? { ...product, id } : product)
          }
        );

        formMessage.textContent = data.message || "Product saved successfully.";
        resetForm();
        await loadProducts();
      } catch (error) {
        formMessage.textContent = error.message;
      } finally {
        saveButton.disabled = false;
      }
    });

    async function deleteProduct(product) {
      if (!confirm('Delete "' + product.name + '"?')) {
        return;
      }

      try {
        await apiRequest(
          "/api/products?id=" + encodeURIComponent(product.id),
          { method: "DELETE" }
        );

        statusMessage.textContent = "Product deleted.";
        await loadProducts();
      } catch (error) {
        statusMessage.textContent = error.message;
      }
    }

    document.getElementById("refreshButton").addEventListener(
      "click",
      loadProducts
    );

    document.getElementById("logoutButton").addEventListener(
      "click",
      async function() {
        try {
          await fetch("/api/admin-session", {
            method: "DELETE",
            credentials: "same-origin"
          });
        } finally {
          resetForm();
          showLogin("You have been logged out.");
        }
      }
    );

    async function checkSession() {
      try {
        const response = await fetch("/api/admin-session", {
          method: "GET",
          credentials: "same-origin"
        });

        const data = await response.json();

        if (response.ok && data.authenticated === true) {
          await showAdmin();
        } else {
          showLogin();
        }
      } catch {
        showLogin("Could not check your login. Please try again.");
      }
    }

    checkSession();
  </script>
</body>
</html>
